<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Usage and Addiction Scores</title>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="filter.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <h1>Social Media Usage and Addiction Scores</h1>

    Filter on: <select id="typeFilter"></select>

    <canvas id="revenueChart"></canvas>

    <div class="table-container">
     <table id="dataTable">
         <thead>
             <tr>
                 <th>Average Daily Usage (Hours)</th>
                 <th>Addiction Score</th>
                 <th>Most Used Platform</th>
             </tr>
         </thead>
         <tbody></tbody>
     </table>
    </div>

    <p>Data source: <a href='https://www.kaggle.com/datasets/zahranusratt/student-social-media-addiction-analysis-dataset'>Student Social Media Addiction Dataset (Kaggle)</a></p>

</body>
</html>
